pianotell-flamoji:
  admin:
    settings:
      emoji_settings_heading: 表情设置
      category_settings_heading: 分类设置
      general_ui_settings_heading: 通用界面设置
      show_variants_label: 显示肤色变体
      show_variants_text: 部分表情支持肤色变体。当在选择器中选中带变体的表情时，会弹出变体面板供用户选择所需变体。
      auto_hide_label: 自动隐藏
      auto_hide_text: 选择表情后隐藏选择器。
      show_preview_label: 显示预览区域
      show_preview_text: 在选择器网格下方的预览面板中显示表情名称、短代码和肤色选择器。
      show_category_buttons_label: 显示分类按钮
      show_category_buttons_text: 在选择器顶部显示分类图标行。仅启用一两个分类时可考虑关闭。
      show_search_label: 显示搜索输入框
      show_search_text: 在选择器顶部显示搜索框。
      show_recents_label: 显示（并保存）常用表情
      show_recents_text: 在选择器顶部显示“常用”标签。每位用户的常用表情仅保存在其自己的浏览器中。
      prepopulate_recents_label: 预填充热门表情
      prepopulate_recents_text: 启用后，在用户尚未选择任何表情前，“常用”区域会先显示一组默认热门表情。禁用后，该区域初始为空，随着用户选择表情逐步填充。
      frequent_rows_label: 常用表情行数
      frequent_rows_text: 在选择器顶部显示最近/常用表情的行数（1-10）。
      picker_set_label: 表情样式
      picker_set_text: 选择器中表情的显示方式。“自动”会与 Flarum Emoji 扩展保持一致——启用时使用 Twemoji，否则使用系统原生字体——从而让选择器与帖子实际显示一致。
      picker_set_auto: 自动
      picker_set_twemoji: Twemoji
      picker_set_native: 原生
      specify_categories_label: 指定分类
      specify_categories_text: 你可以在这里指定分类列表，选择器只会显示这些分类。

      emoji_categories:
        people: => pianotell-flamoji.ref.emoji_categories.people
        nature: => pianotell-flamoji.ref.emoji_categories.nature
        foods: => pianotell-flamoji.ref.emoji_categories.foods
        activity: => pianotell-flamoji.ref.emoji_categories.activity
